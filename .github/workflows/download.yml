name: Baixar músicas

on:
  workflow_dispatch:        # disparado pelo Supabase quando você adiciona um link
  schedule:
    - cron: "17 */6 * * *"  # rede de segurança: a cada 6h processa o que ficou pendente

# Só um baixador por vez; ele processa toda a fila de uma vez.
concurrency:
  group: downloader
  cancel-in-progress: false

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Instalar yt-dlp (sempre a versão mais nova)
        run: pip install -q -U "yt-dlp[default]" requests

      - name: Baixar
        run: python worker/worker.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
